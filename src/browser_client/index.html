<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Project SONAR - Home</title>
  <link rel="stylesheet" href="styling/styles.css" />
  <style>
    .backend-status-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .backend-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid #2aff7f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #backend-status-text {
      color: #fff;
      font-size: 14px;
      font-weight: 500;
    }

    .backend-status-container.ready {
      background: rgba(42, 255, 127, 0.2);
      border-color: #2aff7f;
    }

    .backend-status-container.ready .backend-spinner {
      border-top-color: #fff;
    }

    .backend-status-container.error {
      background: rgba(244, 67, 54, 0.2);
      border-color: #f44336;
    }

    .backend-status-container.error .backend-spinner {
      border-top-color: #f44336;
    }
  </style>
</head>

<body>

  <header class="top-bar">
    <div class="logo-container">
      <img src="assets/logo.png" alt="Logo" class="logo" />
      <span class="project-name">Project SONAR</span>
    </div>

    <div class="hamburger-menu" id="hamburger-menu">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
  </header>

  <nav class="mobile-nav" id="mobile-nav">
    <ul>
      <li><a href="./index.html">Home</a></li>
      <li><a href="./about.html">About</a></li>
      <li><a href="./browser.html">Session</a></li>
      <li><a href="./sessions.html">Explore Sessions</a></li>
      <li><a href="./test_model.html">Test Model</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-text">
      <h1>What’s our <span class="highlight">plan?</span></h1>
      <p>
        Project SONAR aims to create a collaborative framework for training
        and fine-tuning ML models over decentralized datasets.
      </p>
      <div class="button-group">
        <a href="./about.html" class="btn about-btn">About Us</a>
        <a href="./sessions.html" class="btn explore-btn">Explore</a>
        <a href="./browser.html" class="btn training-btn">Start Training</a>
      </div>
      
      <!-- Backend Status Indicator -->
      <div id="backend-status-container" class="backend-status-container" style="display: none;">
        <div class="backend-spinner"></div>
        <span id="backend-status-text">Spinning up backend server...</span>
      </div>
    </div>
  </section>


  <script>
    const hamburger = document.getElementById("hamburger-menu");
    const mobileNav = document.getElementById("mobile-nav");

    hamburger.addEventListener("click", function () {
      mobileNav.classList.toggle("active");
    });

    // Wakeup call to backend server with infinite retry mechanism
    async function wakeupBackend(retryCount = 0) {
      const backendUrl = 'https://sonar-web-backend.onrender.com/';
      const retryDelay = 10000; // 10 seconds between retries
      
      try {
        console.log(`🌅 Attempting to wake up backend server... (attempt ${retryCount + 1})`);
        console.log('📍 Backend URL:', backendUrl);
        
        const startTime = Date.now();
        const response = await fetch(backendUrl, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
          },
          // Add a timeout to prevent hanging
          signal: AbortSignal.timeout(10000) // 10 second timeout
        });
        
        const endTime = Date.now();
        const responseTime = endTime - startTime;
        
        if (response.ok) {
          const data = await response.json();
          console.log('✅ Backend server is awake and responding!');
          console.log('📊 Response:', data);
          console.log('⏱️ Response time:', responseTime + 'ms');
          
          // Add a visual indicator to the page
          showBackendStatus('Backend server is online and ready!', 'ready');
          return true; // Success
        } else {
          console.warn('⚠️ Backend server responded with status:', response.status);
          showBackendStatus(`Backend server error (${response.status})`, 'warning');
          return false;
        }
      } catch (error) {
        console.error('❌ Failed to wake up backend server:', error);
        
        if (error.name === 'AbortError') {
          console.log('⏰ Request timed out after 10 seconds');
          showBackendStatus('Backend server is starting up (timeout)', 'info');
        } else if (error.name === 'TypeError' && error.message.includes('fetch')) {
          console.log('🌐 Network error - server might be starting up');
          showBackendStatus('Backend server is starting up', 'info');
        } else {
          showBackendStatus('Backend server connection failed', 'error');
        }
        
        // Infinite retry logic for server startup
        console.log(`🔄 Retrying in ${retryDelay/1000} seconds...`);
        showBackendStatus(`Spinning up backend server... (attempt ${retryCount + 1})`, 'info');
        
        setTimeout(() => {
          wakeupBackend(retryCount + 1);
        }, retryDelay);
        
        return false;
      }
    }

    // Function to show backend status on the page
    function showBackendStatus(message, type) {
      const statusContainer = document.getElementById('backend-status-container');
      const statusText = document.getElementById('backend-status-text');
      
      if (!statusContainer || !statusText) return;
      
      // Show the container
      statusContainer.style.display = 'flex';
      
      // Update text
      statusText.textContent = message;
      
      // Update styling based on type
      statusContainer.className = 'backend-status-container';
      
      switch (type) {
        case 'success':
        case 'ready':
          statusContainer.classList.add('ready');
          break;
        case 'error':
          statusContainer.classList.add('error');
          break;
        case 'warning':
        case 'info':
        default:
          // Keep default styling for info/warning
          break;
      }
    }

    // Global variable to track if backend is awake
    let backendAwake = false;
    let healthCheckInterval = null;

    // Periodic health check to keep server warm
    function startHealthCheck() {
      if (healthCheckInterval) {
        clearInterval(healthCheckInterval);
      }
      
      healthCheckInterval = setInterval(async () => {
        if (backendAwake) {
          try {
            const response = await fetch('https://sonar-web-backend.onrender.com/', {
              method: 'GET',
              signal: AbortSignal.timeout(5000) // 5 second timeout for health checks
            });
            
            if (!response.ok) {
              console.log('⚠️ Backend health check failed, re-initiating wakeup...');
              backendAwake = false;
              wakeupBackend();
            }
          } catch (error) {
            console.log('⚠️ Backend health check error, re-initiating wakeup...');
            backendAwake = false;
            wakeupBackend();
          }
        }
      }, 30000); // Check every 30 seconds
    }

    // Wake up backend when page loads
    document.addEventListener('DOMContentLoaded', function() {
      console.log('🚀 Page loaded, initiating backend wakeup...');
      wakeupBackend().then(success => {
        if (success) {
          backendAwake = true;
          startHealthCheck();
        }
      });
    });

    // Also wake up backend when page becomes visible (in case user switches tabs)
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        console.log('👁️ Page became visible, checking backend status...');
        wakeupBackend().then(success => {
          if (success && !backendAwake) {
            backendAwake = true;
            startHealthCheck();
          }
        });
      }
    });

    // Clean up interval when page unloads
    window.addEventListener('beforeunload', function() {
      if (healthCheckInterval) {
        clearInterval(healthCheckInterval);
      }
    });
  </script>

</body>

</html>
